<!DOCTYPE html>
<html>
<head>
	<title>Race Info. and Results</title>
	<link href="https://unpkg.com/gridjs/dist/theme/mermaid.min.css" rel="stylesheet" />
	<link rel="stylesheet" href="css/style.css" />
	<link rel="stylesheet" href="css/grid.css" />

	<style>
		* {
			box-sizing: border-box;
		}

		input[type=text],
		select,
		textarea {
			width: 100%;
			padding: 12px;
			border: 1px solid #ccc;
			border-radius: 4px;
			resize: vertical;
			margin: 2px;
		}

		label {
			padding: 12px 12px 12px 0;
			display: inline-block;
		}

		input[type=button] {
			background-color: #1B6CC0;
			color: white;
			padding: 12px 20px;
			border: none;
			border-radius: 4px;
			cursor: pointer;
		}

		input[type=button]:hover {
			background-color: #45a049;
		}

		.container {
			border-radius: 5px;
			background-color: #d8e9fe;
			padding: 20px;
			width: 90%;
			margin: 0 auto;
		}

		.col-25 {
			float: left;
			width: 25%;
			margin-top: 6px;
		}

		.col-75 {
			float: left;
			width: 75%;
			margin-top: 6px;
		}

		/* Clear floats after the columns */
		.row::after {
			content: "";
			display: table;
			clear: both;
		}

		.blinglabel {
			font-weight: bolder;
			width: 130px;
			height: 40px;
			padding: 10px;
			margin: 10px;
			text-align: left;
			vertical-align: bottom;
		}

		.blingtext {
			padding: 10px;
			border: 0px white solid;
			border-radius: 5px;
			height: 40px;
			font-size: large;
			font-weight: bolder;
			background: lightblue;
			width: 350px;
		}

		.blingbox {
			#width: 400px;
			#height: 600px;
			position: relative;
			#top: 100px;
			background: lightblue;
			#border-radius: 10px;
			margin: 20px;
			padding: 20px;
		}

		.blingcontainer {
			width: 98%;
			#height: 90%;
			z-index: 3;
			top: 100px;
			left: 1%;
			background: aliceblue;
			#border-radius: 10px;
			justify-content: center;
			padding: 20px;
		}

		.imageclass {
			height: 250px;
			margin: 30px;
			margin-bottom: 15px;
			border: 1px white solid;
			border-radius: 10px;
			display: block;
			overflow: hidden;
			width: 340px;
			background-color: white;
		}

		.blinginput {
			border: 1px white solid;
			border-radius: 10px;
			display: block;
			overflow: hidden;
			width: 99%;
			float: right;
			color: blue;
			text-align: center;
		}

		.blinginputdiv {
			padding: 5px;
			#display: flex;
			width: 99%;
		}

		/* Responsive layout - when the screen is less than 600px wide, make the two columns stack on top of each other instead of next to each other
@media screen and (max-width: 600px) {
  .col-25, .col-75, input[type=submit] {
    width: 100%;
    margin-top: 0;
  }
}*/
	</style>

	<script src="https://unpkg.com/vue@2"></script>

	<script type="text/x-template" id="grid-template">
      <table>
        <thead>
          <tr>
            <th v-for="key in columns" @click="sortBy(key)" :class="{ active: sortKey == key }">
              {{ key | capitalize }}
              <span class="arrow" :class="sortOrders[key] > 0 ? 'asc' : 'dsc'"></span>
            </th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="entry in filteredHeroes">
            <td v-for="key in columns">
              <div v-if="key=='id' || key=='bibID'">
                  <a :id="entry[key]" onclick="loadRunner(this);">{{ entry[key] }}</a>
              </div>

              <div v-else-if="key=='splits'">
                   <div style="height: 80px; border: 1px solid blue; scroll-behavior: auto;overflow: auto;">
                        <div v-for="row in entry[key]">{{ row }}</div>
                  </div>
              </div>

              <div v-else>{{ entry[key] }}</div>
            </td>
          </tr>
        </tbody>
      </table>
	</script>

	<script src="js/runs.js"></script>
</head>

<body style="background:white">
	<div>
		<img src="images/logo.png" alt="Logo" style="width:150px">
		<h2 class="header_1 color_3">Timing Application</h2>
	</div>

	<p style="width: 90%;margin: 0 auto;font-weight:bold">Welcome to the Timing Application Demo Server</p>

	<form>
		<div class="container">
			<input pattern="[a-zA-Z0-9]+" oninvalid="setCustomValidity('Please enter alphabets & numerics only. ')" type="text" id="raceID" name="raceID" placeholder="Enter Race ID">
			<input pattern="[a-zA-Z0-9]+" oninvalid="setCustomValidity('Please enter Token. ')" type="text" id="token" name="token" placeholder="Enter Token">

			<div style="display:inline-flex;margin-top:20px">
				<input type="button" onclick="getResults(document.getElementById('raceID').value,document.getElementById('token').value);" value="Get Results" style="margin-right:40px">
							<p id="loader" style="display:none">Loading....</p>
			</div>
		</div>

		<br />

	</form>

	<br />


	<!-- JSON Editor for Race -->
<div id="raceEditor" class="container" style="display:none;">
  <h3>Edit Race Details</h3>

  <label>Name:</label><input type="text" id="edit_name">
  <label>ID:</label><input type="text" id="edit_id" disabled>
  <label>Event Date:</label><input type="text" id="edit_eventDate">
  <label>Address:</label><input type="text" id="edit_address">
  <label>City:</label><input type="text" id="edit_city">
  <label>Photo URL:</label><input type="text" id="edit_photo">
  <label>Email:</label><input type="text" id="edit_email">
  <label>Mobile 1:</label><input type="text" id="edit_mobile1">
  <label>Mobile 2:</label><input type="text" id="edit_mobile2">
	
	<div id="reports">
		<div class="container">
		<h3>Edit Race Meta</h3>

		<h4>Groups</h4>
		<label>KM:</label><input v-model="tempGroup.km" type="number">
		<label>Fees:</label><input v-model="tempGroup.fees" type="number">
		<label>Gun Time:</label><input v-model="tempGroup.gunTime">
		<label>Gun Time Stamp:</label><input v-model="tempGroup.gunTimeStamp">
		<label>Stop Time:</label><input v-model="tempGroup.stopTime">
		<label>Stop Time Stamp:</label><input v-model="tempGroup.stopTimeStamp">
		<button @click="saveGroup">Save Group</button>
		<hr>
		<div v-for="(group, index) in metaGroups" :key="index">
		<label>KM:</label><input v-model="group.km" type="number">
		<label>Fees:</label><input v-model="group.fees" type="number">
		<label>Gun Time:</label><input v-model="group.gunTime">
		<label>Gun Time Stamp:</label><input v-model="group.gunTime">
		<label>Stop Time:</label><input v-model="group.stopTime">
		<label>Stop Time Stamp:</label><input v-model="group.stopTimeStamp">
		</div>

		<h4>Readers</h4>
		<label>ID:</label><input v-model="tempReader.readerID">
		<label>Loaction:</label><input v-model="tempReader.location">
		<label>Lapse Time:</label><input v-model="tempReader.lapseTime">
		<button @click="saveReader">Save Reader</button>
		<hr>
		<div v-for="(reader, index) in metaReaders" :key="index">
		<label>ID:</label> <input v-model="reader.readerID">
		<label>Location:</label><input v-model="reader.location">
		<label>Lapse Time:</label><input v-model="reader.lapseTime">
		</div>

		<h4>Results</h4>
		<label>KM:</label><input v-model="tempResult.km">
			<div v-for="(age, index) in tempResult.age">
				<label>Min:</label><input v-model="age.min" type="number">
				<label>Max:</label><input v-model="age.max">
				<label>Gender:</label><input v-model="age.gender">
			</div>
			<button @click="saveResult">Save Result</button>
			<hr>
		<div v-for="(res, ri) in metaResults" :key="ri">
		<label>KM:</label><input v-model="res.km">
		<div v-for="(age, ai) in res.age" :key="ai">
			<label><h5>Age:</h5></label>
			<label>Min:</label><input v-model="age.min">
			<label>Max:</label><input v-model="age.max">
			<label>Gender:</label><input v-model="age.gender">
		</div>
		</div>
		</div>
	</div>
  <br><br>
  <input type="button" value="Save Updated Race" onclick="submitUpdatedRace()">
</div>
	<script>
		var reports = new Vue({
			el: "#reports",
			data: {
				filteredRecords: [],
				columns: [],
				metaGroups: [],
				metaReaders: [],
				metaResults: [],
				tempGroup: { km: '', fees: '', gunTime: '', gunTimeStamp: '', stopTime: '', stopTimeStamp: '' },
				tempReader: { readerID: '', locaction: '', lapseTime: ''},
				tempResult: { km: '', age: [{ min: '', max: '', gender: ''}]}
			}, methods: {
				saveGroup() {
					this.metaGroups.push(this.tempGroup);
					this.tempGroup= { km: '', fees: '', gunTime: '', gunTimeStamp: '', stopTime: '', stopTimeStamp: '' };
				},
				saveReader() {
					this.metaReaders.push(this.tempReader);
					this.tempReader = { readerID: '', loaction: '', lapseTime: ''};
				},
				saveResult() {
					this.metaResults.push(this.tempResult);
					this.tempResult = { km: '', age: [{ min: '', max: '', gender: ''}]};
				}
			}
			});
	</script>
</body>
</html>
